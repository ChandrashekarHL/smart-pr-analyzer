# v1.0 - DeepSeek-Coder 6.7B trained to emit the structured review schema.
# Same recipe that measured fastest for v0.3.1 (QLoRA 4-bit + Unsloth);
# only the corpus and the target field change.
model:
  name: deepseek-ai/deepseek-coder-6.7b-instruct
  dtype: bfloat16
  load_in_4bit: true
  bnb_quant_type: nf4
  bnb_double_quant: true
  attn_implementation: sdpa
  use_unsloth: true

data:
  dir: data/v1
  # One-line JSON rendered by prana.schema.render_structured at finalize time,
  # so the serialisation the model learns is the one the evaluator parses.
  target_field: target_text
  max_seq_length: 2048
  packing: true
  # The RAG slot is empty in every v1.0 row; dropout is a no-op here and is
  # kept so the config is unchanged when v1.1 adds rag_context.
  context_dropout: 0.3

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: null

train:
  batch_size: 8
  grad_accum: 4          # effective 32
  # ~12-13k rows -> ~150 steps/epoch. Three epochs is ~450 steps, ~8 h; v0.3.1's
  # eval loss was still falling at the end of two on a larger set.
  epochs: 3
  lr: 0.0001
  scheduler: cosine
  warmup_ratio: 0.03
  max_grad_norm: 1.0
  logging_steps: 10
  save_steps: 50
  save_total_limit: 3
  eval_steps: 50
  gradient_checkpointing: true
  optim: paged_adamw_8bit
  seed: 13

wandb:
  enabled: true
  project: smart-github-pr-analyzer
  run_name: v1.0-deepseek-6.7b-qlora-structured

output: {dir: runs/v1.0}
