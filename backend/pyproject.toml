[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prana-app"
version = "0.1.0"
description = "GitHub App backend for the PR Analyzer: webhook, review queue, inline comments"
requires-python = ">=3.11"
# Exact pins live in requirements.txt (what the image installs); these are
# the compatible ranges the code is written against.
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "PyJWT[crypto]>=2.8",
    "celery[redis]>=5.3",
    "redis>=5",
    "SQLAlchemy>=2.0",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]          # assert is how pytest works

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]   # fake secrets in tests
