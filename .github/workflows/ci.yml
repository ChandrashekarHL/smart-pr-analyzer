# CI (design doc NFR "Maintainability" + Phase 5): tests on every push and PR;
# on main, the backend image is built and pushed to GitHub's registry.
#
# What runs where: everything that needs no GPU runs here. Training and model
# tests that load weights (torch) and the embedding-index test (chromadb) run
# on the DGX Spark, where the weights are.
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: model-side tests (prana)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip}
      - run: pip install pytest==9.2.0 rouge-score==0.1.2 fastapi==0.161.1 httpx==0.28.1
      - run: python -m pytest -p no:warnings -rs
        env: {PYTHONPATH: src}

  backend:
    name: backend + dashboard lint and tests
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt -r dashboard/requirements.txt pytest==9.2.0 ruff==0.17.3
      - run: ruff check src tests dashboard
      - run: python -m pytest -p no:warnings
        env: {PYTHONPATH: "src:../src:tests"}

  image:
    name: backend image
    needs: [core, backend]
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v5
      # Registry paths must be lower case; GitHub usernames need not be.
      - run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ env.OWNER }}/prana-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/dashboard/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ env.OWNER }}/prana-dashboard:${{ github.sha }}
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard
